name: Build docker images with assets

on:
  workflow_dispatch:
  push:
    branches: ['master']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PANDORA_REPO: cq-pandora/projects

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Checkout assets repository
      uses: actions/checkout@v7
      with:
        path: assets

    - name: Build base image
      uses: docker/build-push-action@v7
      with:
        context: assets/
        push: true
        file: assets/docker/Dockerfile.base
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base

    - name: Build web image
      uses: docker/build-push-action@v7
      with:
        context: assets/docker
        push: true
        file: assets/docker/Dockerfile.web
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:web
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base

    - name: Checkout pandora repository
      uses: actions/checkout@v7
      with:
        repository: ${{ env.PANDORA_REPO }}
        path: pandora

    - name: Build pandora image
      uses: docker/build-push-action@v7
      with:
        context: pandora
        push: true
        file: pandora/services/bot/Dockerfile
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bot
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base

    # depsos restarts both containers, which pulls the images pushed above
    - name: Redeploy on depsos
      if: github.ref == 'refs/heads/master'
      env:
        REDEPLOY_SECRET: ${{ secrets.REDEPLOY_SECRET }}
        REDEPLOY_URL: https://data.fenrir.moe/_hooks/pandora-redeploy
      run: |
        body=$(jq -cn --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" '{sha: $sha, run: $run}')
        signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$REDEPLOY_SECRET" -r | cut -d' ' -f1)
        curl -fsS -X POST "$REDEPLOY_URL" \
          -H 'Content-Type: application/json' \
          -H "X-Hub-Signature-256: sha256=$signature" \
          --data "$body"
